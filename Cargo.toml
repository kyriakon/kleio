[workspace]
resolver = "2"
members = [
    "crates/kleio-core",
    "crates/kleio-crypto",
    "crates/kleio-store",
    "crates/kleio-git",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
authors = ["Kyriakon <kyriakon.net>"]

[workspace.dependencies]
kleio-core = { path = "crates/kleio-core" }
kleio-crypto = { path = "crates/kleio-crypto" }
kleio-store = { path = "crates/kleio-store" }
kleio-git = { path = "crates/kleio-git" }
